name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Build APK with Gradle
        run: |
          mkdir -p src/main
          mv AndroidManifest.xml src/main/
          mkdir -p src/main/java/com/robboy/ytstorefront
          mv MainActivity.kt src/main/java/com/robboy/ytstorefront/
          
          # Skapa settings.gradle med rätt plugin-repositorium
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'YTStorefront'
          EOF

          # Skapa build.gradle med versioner
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          subprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # Skapa app-specifik build.gradle
          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              compileSdk 34
              namespace "com.robboy.ytstorefront"
              defaultConfig {
                  applicationId "com.robboy.ytstorefront"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Kop-Shortcut
          path: app/build/outputs/apk/debug/*.apk
          

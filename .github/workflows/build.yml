name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Build APK with Gradle
        run: |
          # Skapa projektstrukturen
          mkdir -p src/main/java/com/robboy/ytstorefront
          
          # Flytta källkodsfiler till rätt plats
          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml src/main/
          fi
          if [ -f MainActivity.kt ]; then
            mv MainActivity.kt src/main/java/com/robboy/ytstorefront/
          fi
          
          # Skapa settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = 'YTStorefront'
          EOF

          # Skapa build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.2'
              id 'org.jetbrains.kotlin.android' version '1.9.0'
          }

          android {
              compileSdk 34
              namespace "com.robboy.ytstorefront"

              defaultConfig {
                  applicationId "com.robboy.ytstorefront"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }

          repositories {
              google()
              mavenCentral()
          }
          EOF

          # Generera Gradle Wrapper och bygg APK
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Kop-Shortcut
          path: build/outputs/apk/debug/*.apk
          

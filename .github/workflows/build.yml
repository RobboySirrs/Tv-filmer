name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          mkdir -p src/main/java/com/robboy/ytstorefront
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml src/main/; fi
          if [ -f MainActivity.kt ]; then mv MainActivity.kt src/main/java/com/robboy/ytstorefront/; fi

          # namespace sätts i build.gradle, ta bort package= ur manifestet
          sed -i 's/ *package="[^"]*"//' src/main/AndroidManifest.xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'YTStorefront'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.2'
              id 'org.jetbrains.kotlin.android' version '1.9.0'
          }

          android {
              compileSdk 34
              namespace "com.robboy.ytstorefront"
              defaultConfig {
                  applicationId "com.robboy.ytstorefront"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Kop-Shortcut
          path: build/outputs/apk/debug/*.apk
